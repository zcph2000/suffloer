  draft = s;
  draft._live = true;
  draft.notes = draft.notes || [];
  const showNotes = store.data.settings.workNotes !== false;

  main.appendChild(el("h2", { class: "screen-title", text: draft.title }));

  // controls
  const notesToggle = el("label", { class: "toggle-row", style: "margin-bottom:12px" }, [
    el("div", { class: "toggle-row__text" }, [
      el("b", { text: "Vis noter" }),
      el("span", { text: `${(draft.notes || []).length} i alt` }),
    ]),
    (() => {
      const c = el("input", { type: "checkbox", class: "switch" });
      c.checked = showNotes;
      c.addEventListener("change", () => { store.data.settings.workNotes = c.checked; store.save(); render(); });
      return c;
    })(),
  ]);
  main.appendChild(notesToggle);

  // roles
  main.appendChild(el("div", { class: "eyebrow", text: "Roller" }));
  const chips = el("div", { class: "chips", style: "margin-bottom:6px" });
  deriveCharacters(draft.lines).forEach(c => {
    chips.appendChild(el("button", {
      class: "chip" + (c.name === draft.myCharacter ? " chip--you" : ""),
      "aria-pressed": String(c.name === draft.myCharacter),
      onclick: () => openCharSheet(c.name),
    }, [c.name, el("span", { class: "chip__count", text: String(c.count) })]));
  });
  main.appendChild(chips);
  main.appendChild(el("p", { class: "muted-note", style: "margin:6px 0 4px" }, ["Tryk på en replik for at skrive en note, redigere teksten, indsætte eller dele scenen. Tryk på et rollenavn for at omdøbe."]));

  const body = el("div", { class: showNotes ? "work--notes" : "" });
  main.appendChild(body);

  const lineIndex = new Map(draft.lines.map((l, i) => [l, i]));

  draft.scenes.forEach((scene, si) => {
    const sceneLines = draft.lines.filter(l => l.scene === si);

    const titleInput = el("input", {
      class: "work-scene-title", type: "text", value: scene.title,
      "aria-label": "Scenetitel",
    });
    titleInput.addEventListener("change", () => {
      scene.title = titleInput.value.trim() || ("Scene " + (si + 1));
      touch();
    });
    const sceneRow = el("div", { class: "work-scene" }, [
      el("span", { class: "scene-item__num", text: String(si + 1).padStart(2, "0") }),
      titleInput,
      si > 0 ? el("button", {
        class: "icon-btn", "aria-label": "Slå sammen med forrige scene", title: "Slå sammen med forrige", text: "⇧",
        onclick: () => { mergeSceneUp(si); render(); },
      }) : null,
    ]);
    body.appendChild(sceneRow);

    let prevLine = null;
    sceneLines.forEach(l => {
      const idx = lineIndex.get(l);
      const myNotes = notesForLine(l.id);
      const runStart = !(l.kind === "dialogue" && l.cont && prevLine &&
        prevLine.kind === "dialogue" && prevLine.character === l.character);
      prevLine = l;

      const main1 = el("div", {});
      if (l.num) {
        main1.appendChild(el("div", { class: "line__text", style: "font-size:.8rem;font-style:italic;opacity:.5", text: "sidetal — " + l.text }));
      } else {
        if (l.character && runStart && l.kind === "dialogue") {
          const cue = el("div", { class: "line__cue" }, [l.character]);
          if (!showNotes && myNotes.length) cue.appendChild(el("span", { class: "work-note-badge", text: "📝 " + myNotes.length }));
          main1.appendChild(cue);
        }
        const txt = el("div", { class: "line__text", text: l.text });
        if (l.kind === "action" || l.kind === "heading") { txt.style.fontStyle = "italic"; txt.style.color = "var(--ink-muted)"; }
        if (!showNotes && myNotes.length && !(l.character && runStart)) {
          txt.appendChild(el("span", { class: "work-note-badge", text: "📝 " + myNotes.length }));
        }
        main1.appendChild(txt);
      }

      const noteCol = el("div", { class: "work-note-col" });
      if (showNotes) {
        myNotes.forEach(n => {
          const card = el("div", { class: "work-note", text: n.text });
          card.addEventListener("click", e => { e.stopPropagation(); openNoteSheet(l.id, n.id); });
          noteCol.appendChild(card);
        });
        const add = el("div", { class: "work-note work-note--add", text: myNotes.length ? "+" : "+ note" });
        add.addEventListener("click", e => { e.stopPropagation(); openNoteSheet(l.id); });
        noteCol.appendChild(add);
      }

      const row = el("div", {
        class: "work-line" + (myNotes.length ? " has-note" : "") + (l.character && l.character === draft.myCharacter ? " is-you" : ""),
        onclick: () => openLineSheet(idx),
      }, [main1, noteCol]);
      body.appendChild(row);
    });
  });

  main.appendChild(el("hr", { class: "divider" }));
  main.appendChild(el("button", {
    class: "btn btn--primary",
    onclick: () => {
      store.save();
      go(draft.myCharacter ? "setup" : "script", draft.myCharacter ? { id, scenes: "all" } : { id });
    },
  }, ["▶  Øve"]));
};

/* ---------- Voices ---------- */
VIEWS.voices = ({ id }) => {
  const s = store.script(id);
  if (!s) { go("library", {}, { push: false }); return; }
  topTitle.textContent = "Stemmer";
  // fresh slate — you're here to test voices
  speech._gBlocked = false; speech._gBackoff = 0; speech._gBackoffUntil = 0; speech._warned = false;
  gtts._badVoices.clear();
  main.appendChild(el("h2", { class: "screen-title", text: "Stemmer" }));

  const ai = gtts.enabled();
  const pool = speech.pool();

  if (ai) {
    main.appendChild(el("p", { class: "lede" }, [
      "AI-stemmer (Google) er slået til. Vælg en stemme til hver rolle.",
    ]));
  } else if (!speech.supported) {
    main.appendChild(el("p", { class: "muted-note", text: "Denne browser understøtter ikke oplæsning." }));
    return;
  } else if (!speech.danish().length) {
    main.appendChild(el("p", { class: "muted-note" }, [
      "Ingen danske stemmer på enheden. På iPhone: ", el("b", { text: "Indstillinger → Tilgængelighed → Talt indhold → Stemmer → Dansk" }),
      ". Eller slå AI-stemmer til for rigtige danske stemmer.",
    ]));
  }

  const names0 = s.characters.map(c => c.name);
  const row = el("div", { class: "btn-row", style: "margin-bottom:14px" }, [
    el("button", { class: "btn btn--subtle", onclick: () => go("aistemmer") },
      [ai ? "⚙  AI-stemmer / nøgle" : "✨  Slå AI-stemmer til"]),
  ]);
  if (ai) {
    row.appendChild(el("button", {
      class: "btn btn--subtle",
      onclick: () => { autoAssignVoices(s, names0, { regen: true }); store.save(); render(); toast("Stemmer fordelt igen"); },
    }, ["🔀  Fordel igen"]));
  }
  main.appendChild(row);

  autoAssignVoices(s, names0);
  store.save();

  const gvoices = gtts.voiceList();
  const list = el("div", { class: "card" });
  s.characters.forEach(c => {
    const vm = s.voiceMap[c.name];
    const sel = el("select");
    if (ai) {
      gvoices.forEach(v => sel.appendChild(el("option", {
        value: v.name,
        text: v.name.replace("da-DK-", "") + (v.gender === "MALE" ? " ♂" : v.gender === "FEMALE" ? " ♀" : ""),
      })));
      sel.value = vm.gvoice || gvoices[0].name;
      sel.addEventListener("change", () => { vm.gvoice = sel.value; store.save(); });
    } else {
      sel.appendChild(el("option", { value: "", text: "(standard)" }));
      pool.forEach(v => sel.appendChild(el("option", { value: v.voiceURI, text: `${v.name} · ${v.lang}` })));
      sel.value = vm.voiceURI || "";
      sel.addEventListener("change", () => { vm.voiceURI = sel.value; store.save(); });
    }
    const playBtn = el("button", {
      class: "icon-btn", "aria-label": "Afspil", text: "▶",
      onclick: () => {
        speech._lastGError = "";
        speech.say(`Hej, jeg er ${c.name}.`, { force: true, voiceURI: vm.voiceURI, gvoice: vm.gvoice, rate: vm.rate, pitch: vm.pitch });
        if (ai) setTimeout(() => { if (speech._lastGError) toast("Kunne ikke: " + speech._lastGError.replace(/^Google TTS \d+\s*/, "").slice(0, 90)); }, 2500);
      },
    });
    list.appendChild(el("div", { class: "voice-item" }, [
      el("div", { class: "voice-item__name", text: c.name }),
      sel,
      playBtn,
    ]));

    const pitchOk = !ai || gtts.capsFor(vm.gvoice || "").pitch;
    if (pitchOk) {
      list.appendChild(el("div", { class: "slider-row", style: "margin:2px 0 6px" }, [
        el("span", { style: "font-size:.7rem;letter-spacing:.08em;color:var(--ink-faint);width:27%", text: "TONE" }),
        (() => {
          const r = el("input", { type: "range", min: "0.6", max: "1.6", step: "0.02", value: String(vm.pitch ?? 1) });
          const o = el("output", { text: (+(vm.pitch ?? 1)).toFixed(2) });
          r.addEventListener("input", () => { vm.pitch = +r.value; o.textContent = (+r.value).toFixed(2); });
          r.addEventListener("change", () => store.save());
          return el("div", { class: "slider-row", style: "flex:1" }, [r, o]);
        })(),
      ]));
    } else {
      list.appendChild(el("div", { style: "font-size:.72rem;color:var(--ink-faint);margin:2px 0 6px" },
        ["Denne stemme har fast toneleje."]));
    }
  });
  main.appendChild(list);

  // ---- prepare all audio for offline use ----
  if (ai) {
    main.appendChild(el("div", { class: "eyebrow", text: "Offline-lyd" }));
    const card = el("div", { class: "card" });
    const status = el("p", { class: "seg__hint", style: "margin:0 0 10px" }, ["Tjekker …"]);
    const bar = el("div", { class: "progress", style: "display:none;margin-bottom:10px" }, [el("div", { class: "progress__fill", id: "prepFill" })]);
    const btn = el("button", { class: "btn btn--primary" }, ["Forbered lyd"]);
    card.appendChild(el("p", { class: "sub", style: "margin-top:0", text: "Hent alle de andre rollers replikker ned nu, så du kan øve helt uden net (fx i bilen)." }));
    card.appendChild(status);
    card.appendChild(bar);
    card.appendChild(btn);
    main.appendChild(card);

    let running = false;
    const refresh = async () => {
      const st = await offlineStatus(s);
      if (running) return;
      if (!st.total) { status.textContent = "Ingen replikker med AI-stemme endnu."; btn.style.display = "none"; return; }
      const missing = st.total - st.have;
      status.textContent = missing === 0 ? `✓ Klar offline — alle ${st.total} replikker.` : `${st.have} / ${st.total} replikker klar.`;
      status.style.color = missing === 0 ? "var(--good)" : "";
      btn.style.display = missing === 0 ? "none" : "";
      btn.textContent = st.have ? `Hent de sidste ${missing}` : "Forbered lyd";
    };
    btn.addEventListener("click", async () => {
      if (running) { _prepAbort = true; return; }
      running = true;
      bar.style.display = "";
      btn.textContent = "Stop";
      btn.classList.add("btn--you");
      status.style.color = "";
      const res = await prepareOffline(s, (done, total) => {
        status.textContent = `Henter … ${done} / ${total}`;
        $("#prepFill").style.width = (100 * done / total) + "%";
      });
      running = false;
      btn.classList.remove("btn--you");
      bar.style.display = "none";
      if (res.aborted) toast("Stoppet — du kan fortsætte senere");
      else if (speech._gBlocked) showError((speech._lastGError || "").slice(0, 160), "AI-stemme afvist");
      refresh();
    });
    refresh();
  }

  main.appendChild(el("button", { class: "btn btn--ghost", style: "margin-top:16px", onclick: () => back() }, ["Færdig"]));
};

/* ---------- Setup a rehearsal ---------- */
VIEWS.setup = ({ id, scenes }) => {
  const s = store.script(id);
  if (!s) { go("library", {}, { push: false }); return; }
  topTitle.textContent = "Klargør øvning";

  const allIdx = s.scenes.map((_, i) => i);
  let chosen = scenes === "all" ? allIdx.slice() : scenes.slice();
  let hintSeg, hintHint;

  const st = {
    mode: "practice",           // listen | read | practice
    readMine: false,
    speakDirections: false,
    hint: store.data.settings.hint || "hide",   // hide | start | full
    listen: false,
    showNotes: (s.notes || []).length > 0,
    others: new Set(),
  };

  const rebuildOthers = () => {
    const present = new Set();
    s.lines.forEach(l => { if (chosen.includes(l.scene) && l.character && l.character !== s.myCharacter) present.add(l.character); });
    // keep only still-present, default-select all present
    st.others = new Set([...present]);
    return present;
  };
  rebuildOthers();

  const wrap = el("div", { class: "stack" });
  main.appendChild(wrap);

  wrap.appendChild(el("h2", { class: "screen-title", text: "Øv" }));
  wrap.appendChild(el("p", { class: "lede" }, [
    "Din rolle: ", el("b", { style: "color:var(--you-ink)", text: s.myCharacter }),
  ]));

  // Scenes
  wrap.appendChild(el("div", { class: "eyebrow", text: "Scener" }));
  const sceneList = el("div", { class: "stack" });
  const renderScenes = () => {
    sceneList.innerHTML = "";
    s.scenes.forEach((sc, i) => {
      const on = chosen.includes(i);
      const lc = s.lines.filter(l => l.scene === i && l.kind === "dialogue").length;
      sceneList.appendChild(el("div", {
        class: "scene-item", "aria-pressed": String(on),
        onclick: () => {
          if (on) chosen = chosen.filter(x => x !== i);
          else chosen = [...chosen, i].sort((a, b) => a - b);
          rebuildOthers(); render2();
        },
      }, [
        el("div", { class: "scene-item__check", text: on ? "✓" : "" }),
        el("div", { style: "flex:1" }, [
          el("p", { class: "scene-item__title", text: sc.title }),
          el("div", { class: "scene-item__meta", text: `${lc} replikker` }),
        ]),
      ]));
    });
  };
  wrap.appendChild(sceneList);
  const selRow = el("div", { class: "btn-row", style: "margin-top:4px" }, [
    el("button", { class: "btn btn--subtle", onclick: () => { chosen = allIdx.slice(); rebuildOthers(); render2(); } }, ["Vælg alle"]),
    el("button", { class: "btn btn--subtle", onclick: () => { chosen = []; rebuildOthers(); render2(); } }, ["Ryd"]),
  ]);
  wrap.appendChild(selRow);

  // Other characters
  wrap.appendChild(el("div", { class: "eyebrow", text: "Medspillere med stemme" }));
  const otherChips = el("div", { class: "chips" });
  wrap.appendChild(otherChips);
  const otherNote = el("p", { class: "muted-note" }, ["Roller uden flueben vises som tekst, men læses ikke højt."]);
  wrap.appendChild(otherNote);

  // Mode
  wrap.appendChild(el("div", { class: "eyebrow", text: "Måde" }));
  const seg = el("div", { class: "seg" }, [
    el("button", { onclick: () => setMode("listen"), text: "Lyt" }),
    el("button", { onclick: () => setMode("read"), text: "Læs" }),
    el("button", { onclick: () => setMode("practice"), text: "Øv" }),
  ]);
  const segHint = el("p", { class: "seg__hint" });
  wrap.appendChild(seg);
  wrap.appendChild(segHint);

  const mineToggle = el("label", { class: "toggle-row" }, [
    el("div", { class: "toggle-row__text" }, [
      el("b", { text: "Læs også mine replikker højt" }),
      el("span", { text: "Godt til de første gennemlæsninger." }),
    ]),
    (() => {
      const c = el("input", { type: "checkbox", class: "switch" });
      c.addEventListener("change", () => st.readMine = c.checked);
      return c;
    })(),
  ]);
  const dirToggle = el("label", { class: "toggle-row" }, [
    el("div", { class: "toggle-row__text" }, [
      el("b", { text: "Læs sceneanvisninger højt" }),
      el("span", { text: "Ellers vises de kun på skærmen." }),
    ]),
    (() => {
      const c = el("input", { type: "checkbox", class: "switch" });
      c.addEventListener("change", () => st.speakDirections = c.checked);
      return c;
    })(),
  ]);

  // Hint level for your own lines (practice only)
  const hintBox = el("div", {}, [
    el("div", { class: "eyebrow", style: "margin-bottom:8px", text: "Dine replikker" }),
    (() => {
      const g = el("div", { class: "seg" }, [
        el("button", { onclick: () => setHint("hide"), text: "Skjult" }),
        el("button", { onclick: () => setHint("start"), text: "Se starten" }),
        el("button", { onclick: () => setHint("full"), text: "Se alt" }),
      ]);
      hintSeg = g;
      return g;
    })(),
    (hintHint = el("p", { class: "seg__hint" })),
  ]);

  const hasNotes = (s.notes || []).length > 0;
  const notesToggle = el("label", { class: "toggle-row" }, [
    el("div", { class: "toggle-row__text" }, [
      el("b", { text: "Vis mine noter" }),
      el("span", { text: hasNotes ? "Dine noter fra Arbejde vises ved replikkerne." : "Ingen noter endnu — tilføj dem i Arbejde." }),
    ]),
    (() => {
      const c = el("input", { type: "checkbox", class: "switch" });
      if (!hasNotes) c.disabled = true;
      c.checked = st.showNotes;
      c.addEventListener("change", () => st.showNotes = c.checked);
      return c;
    })(),
  ]);

  const srSupported = !!SR;
  const listenToggle = el("label", { class: "toggle-row" }, [
    el("div", { class: "toggle-row__text" }, [
      el("b", { text: "Lyt efter mig (håndfri)" }),
      el("span", { text: srSupported
        ? "Appen hører efter og går selv videre, når du har sagt din replik. Kræver mikrofon-adgang og net."
        : "Denne browser kan ikke lytte. Brug knappen “Næste replik”." }),
    ]),
    (() => {
      const c = el("input", { type: "checkbox", class: "switch" });
      if (!srSupported) c.disabled = true;
      c.addEventListener("change", () => st.listen = c.checked);
      return c;
    })(),
  ]);

  wrap.appendChild(el("div", { class: "stack", style: "margin-top:12px" }, [mineToggle, hintBox, notesToggle, listenToggle, dirToggle]));

  const startBtn = el("button", { class: "btn btn--primary", style: "margin-top:22px" }, ["▶  Start"]);
  startBtn.addEventListener("click", () => {
    if (!chosen.length) { toast("Vælg mindst én scene"); return; }
    autoAssignVoices(s, s.characters.map(c => c.name));
    store.save();
    go("rehearse", {
      id,
      scenes: chosen.slice(),
      mode: st.mode,
      readMine: st.mode === "listen" ? true : (st.mode === "read" ? false : st.readMine),
      speakDirections: st.speakDirections,
      hint: st.mode === "practice" && !st.readMine ? st.hint : "full",
      listen: st.mode === "practice" && !st.readMine && st.listen && !!SR,
      showNotes: !!st.showNotes,
      others: [...st.others],
    });
  });
  wrap.appendChild(startBtn);

  function setHint(h) {
    st.hint = h;
    store.data.settings.hint = h; store.save();
    [...hintSeg.children].forEach((b, i) => b.setAttribute("aria-pressed", String(["hide", "start", "full"][i] === h)));
    hintHint.textContent = h === "hide"
      ? "Replikken er skjult. Tryk for at afsløre ord for ord."
      : h === "start"
        ? "De første par ord vises som igangsætter — resten er skjult."
        : "Hele replikken vises, som en sufflør-skærm.";
  }

  function setMode(m) {
    st.mode = m;
    [...seg.children].forEach((b, i) => b.setAttribute("aria-pressed", String(["listen", "read", "practice"][i] === m)));
    segHint.textContent = m === "listen"
      ? "Alt læses højt — også dine replikker. Læn dig tilbage og lyt."
      : m === "read"
        ? "Ingen lyd. Bladr igennem i dit eget tempo."
        : "De andre roller læses højt. Appen stopper og venter ved dine replikker.";
    const practice = m === "practice";
    mineToggle.style.display = practice ? "" : "none";
    hintBox.style.display = practice ? "" : "none";
    listenToggle.style.display = practice ? "" : "none";
  }

  function render2() {
    renderScenes();
    otherChips.innerHTML = "";
    const present = [...new Set(s.lines.filter(l => chosen.includes(l.scene) && l.character && l.character !== s.myCharacter).map(l => l.character))];
    if (!present.length) otherChips.appendChild(el("p", { class: "muted-note", text: "Ingen andre roller i de valgte scener." }));
    present.forEach(name => {
      const on = st.others.has(name);
      otherChips.appendChild(el("button", {
        class: "chip", type: "button", "aria-pressed": String(on),
        onclick: () => { on ? st.others.delete(name) : st.others.add(name); render2(); },
      }, [name]));
    });
  }

  render2();
  setHint(st.hint);
  setMode("practice");
};

/* ---------- Rehearse engine ---------- */
VIEWS.rehearse = (p) => {
  const s = store.script(p.id);
  if (!s) { go("library", {}, { push: false }); return; }
  topTitle.textContent = s.title;
  backBtn.hidden = false;

  const mine = s.myCharacter;
  const others = new Set(p.others);
  // Build the playlist from selected scenes, in order (page numbers left out)
  const raw = s.lines
    .map((l, i) => ({ ...l, _i: i }))
    .filter(l => p.scenes.includes(l.scene))
    .filter(l => !l._hidden && !l.num)
    .map(l => {
      let role;
      if (l.kind === "heading" || l.kind === "action" || l.kind === "parenthetical") role = "dir";
      else if (l.character === mine) role = "you";
      else if (others.has(l.character)) role = "other";
      else role = "mute";
      return { ...l, role };
    });
  // Collapse a continuing speech (verse lines etc.) into one spoken turn
  const seq = [];
  for (const l of raw) {
    const last = seq[seq.length - 1];
    if (last && l.kind === "dialogue" && last.kind === "dialogue" &&
        l.character === last.character && l.cont) {
      last.text += (l.gap ? "\n\n" : "\n") + l.text;
      last._ids.push(l.id);
    } else {
      seq.push({ ...l, _ids: [l.id] });
    }
  }

  const noteSet = new Set((s.notes || []).map(n => n.lineId));
  const scriptNotes = ids => (s.notes || []).filter(n => ids.includes(n.lineId));

  const dialogueTotal = seq.filter(l => l.role === "you" || l.role === "other" || l.role === "mute").length;

  const scriptWrap = el("div", { id: "scriptWrap" });
  main.appendChild(scriptWrap);
  main.appendChild(el("div", { class: "transport-space" }));

  const lineEls = seq.map((l, idx) => {
    if (l.kind === "heading") {
      const d = el("div", { class: "line line--heading", "data-idx": idx, text: l.text });
      scriptWrap.appendChild(d);
      return d;
    }
    const cls = "line line--" + (l.role === "you" ? "you" : l.role === "other" ? "other" : l.role === "mute" ? "other is-mute" : "action");
    const d = el("div", { class: cls, "data-idx": idx });
    const notes = (l._ids || []).some(x => noteSet.has(x)) ? scriptNotes(l._ids) : [];
    if (l.character && l.kind !== "action") {
      const cue = el("div", { class: "line__cue" }, [l.character]);
      if (notes.length) {
        const b = el("span", { class: "work-note-badge", "data-note-idx": idx, text: "📝 " + notes.length });
        cue.appendChild(b);
      }
      d.appendChild(cue);
    }
    if (l.role === "you" && p.mode === "practice" && !p.readMine && p.hint !== "full") {
      d.appendChild(buildHintLine(l.text, p.hint));
    } else {
      d.appendChild(el("div", { class: "line__text", text: l.text }));
    }
    if (p.showNotes && notes.length) {
      notes.forEach(n => d.appendChild(el("div", { class: "work-note", style: "margin-top:6px", "data-note-idx": idx, text: n.text })));
    } else if (!p.showNotes && notes.length && !(l.character && l.kind !== "action")) {
      d.appendChild(el("span", { class: "work-note-badge", "data-note-idx": idx, text: "📝 " + notes.length }));
    }
    scriptWrap.appendChild(d);
    return d;
  });

  // tap a note badge / card → read this line's notes
  scriptWrap.addEventListener("click", e => {
    const t = e.target.closest("[data-note-idx]");
    if (!t) return;
    e.stopPropagation();
    const l = seq[+t.dataset.noteIdx];
    if (!l) return;
    const list = scriptNotes(l._ids || []);
    openSheet("Noter", el("div", { class: "stack" }, [
      ...list.map(n => el("div", { class: "work-note", style: "-webkit-line-clamp:99;cursor:default", text: n.text })),
      el("button", { class: "btn btn--subtle", onclick: () => { closeSheet(); go("work", { id: p.id }); } }, ["Redigér i Arbejde"]),
    ]));
  }, true);

  // ---- dock ----
  dock.hidden = false;
  const meta = el("div", { class: "dock__meta" }, [
    el("span", { id: "dockScene", text: "" }),
    el("span", { id: "listenDot", style: "color:var(--you-ink);font-weight:600", text: "" }),
    el("span", { id: "dockCount", text: "" }),
  ]);
  const bar = el("div", { class: "progress" }, [el("div", { class: "progress__fill", id: "progFill" })]);
  const btnPrev = el("button", { class: "icon-btn", "aria-label": "Forrige", text: "⏮" });
  const btnPlay = el("button", { class: "dock__play", id: "btnPlay" }, ["▶  Start"]);
  const btnNext = el("button", { class: "icon-btn", "aria-label": "Næste", text: "⏭" });
  const rateWrap = el("div", { class: "rate" }, [
    el("button", { class: "icon-btn", "aria-label": "Langsommere", text: "−", onclick: () => bumpRate(-0.1) }),
    el("span", { id: "rateVal", text: "1.0×" }),
    el("button", { class: "icon-btn", "aria-label": "Hurtigere", text: "+", onclick: () => bumpRate(0.1) }),
  ]);
  dock.appendChild(meta);
  dock.appendChild(bar);
  dock.appendChild(el("div", { class: "dock__controls" }, [btnPrev, btnPlay, btnNext]));
  dock.appendChild(el("div", { style: "display:flex;justify-content:center;margin-top:10px" }, [rateWrap]));

  // ---- engine state ----
  let cursor = -1;
  let playing = false;
  let waiting = false;      // waiting for user to deliver their line (practice)
  let rate = store.data.settings.rate || 0.8;
  updateRate();

  function updateRate() { $("#rateVal").textContent = rate.toFixed(2).replace(/0$/, "") + "×"; }
  function bumpRate(d) {
    rate = clamp(Math.round((rate + d) * 20) / 20, 0.45, 1.5);
    store.data.settings.rate = rate; store.save();
    updateRate();
  }

  function setActive(idx) {
    lineEls.forEach((e, i) => {
      e.classList.toggle("is-active", i === idx);
      if (i < idx) e.classList.add("is-done"); else e.classList.remove("is-done");
    });
    const e = lineEls[idx];
    if (e) e.scrollIntoView({ block: "center", behavior: "smooth" });
    const l = seq[idx];
    if (l) {
      $("#dockScene").textContent = s.scenes[l.scene] ? s.scenes[l.scene].title : "";
      const dLine = seq.slice(0, idx + 1).filter(x => x.role !== "dir" && x.kind !== "heading").length;
      $("#dockCount").textContent = `${dLine} / ${dialogueTotal}`;
      $("#progFill").style.width = (100 * (idx + 1) / seq.length) + "%";
    }
  }

  function speakable(l) {
    if (l.kind === "heading") return p.speakDirections;
    if (l.role === "dir") return p.speakDirections;
    if (l.role === "you") return p.readMine;
    if (l.role === "other") return true;
    return false; // mute
  }

  function voiceFor(l) {
    const who = l.role === "you" ? mine : l.character;
    let vm = s.voiceMap[who];
    if (!vm) { vm = s.voiceMap[who] = {}; }
    // every speaking role needs a Google voice when AI is on (covers late-found characters)
    if (gtts.enabled() && (!vm.gvoice || gtts._badVoices.has(vm.gvoice))) {
      const taken = new Set(Object.values(s.voiceMap).map(x => x && x.gvoice).filter(Boolean).filter(n => !gtts._badVoices.has(n)));
      const pick = gtts.voiceList().find(v => !taken.has(v.name)) || gtts.goodVoice(vm.gvoice);
      if (pick) { vm.gvoice = pick.name; store.save(); }
    }
    return {
      voiceURI: vm.voiceURI,
      gvoice: vm.gvoice,
      rate: vm.rate || 1,   // per-character timbre (kept out of the audio cache key)
      speed: rate,          // global playback speed
      pitch: vm.pitch ?? 1,
    };
  }

  const isYouWait = l => l.role === "you" && p.mode === "practice" && !p.readMine;

  // ---- hands-free listening ----
  let recog = null, listening = false, recogRestarts = 0, silenceTimer = null;
  function setListenDot(on, heard) {
    const d = $("#listenDot");
    if (!d) return;
    d.textContent = on ? (heard ? "🎙 " + heard.slice(0, 26) : "🎙 lytter …") : "";
  }
  function stopListening() {
    listening = false;
    clearTimeout(silenceTimer);
    setListenDot(false);
    if (recog) { try { recog.onend = null; recog.abort(); } catch (e) {} recog = null; }
    _activeRecog = null;
  }
  function startListening(idx) {
    stopListening();
    if (!p.listen || !SR || !seq[idx]) return;
    const target = normWords(seq[idx].text);
    if (!target.length) return;
    const tail = target.slice(-Math.min(3, target.length)).join(" ");
    const need = Math.max(1, Math.round(target.length * 0.4));
    const startedAt = Date.now();
    const hardMs = Math.max(3500, target.length * 650);
    let acc = "", lastAt = 0, gotSpeech = false, finished = false;
    let r;
    try { r = new SR(); } catch (e) { return; }
    recog = r; _activeRecog = r; listening = true; recogRestarts = 0;
    r.lang = "da-DK";
    r.continuous = true;
    r.interimResults = true;

    const advance = () => {
      if (finished || !waiting) return;
      finished = true;
      stopListening();
      setTimeout(() => { if (waiting) deliverAndContinue(); }, 180);
    };
    const check = () => {
      if (finished) return;
      const hw = normWords(acc);
      const hits = target.filter(w => hw.includes(w)).length;
      if ((tail && hw.join(" ").includes(tail)) || hits >= need) return advance();
      if (gotSpeech && hits >= 1 && lastAt && Date.now() - lastAt > 1400) return advance();
      if (gotSpeech && Date.now() - startedAt > hardMs) return advance();
    };

    r.onspeechstart = () => { gotSpeech = true; };
    r.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) acc += " " + e.results[i][0].transcript;
      lastAt = Date.now(); gotSpeech = true;
      setListenDot(true, normWords(acc).slice(-6).join(" "));
      check();
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(check, 1500);
    };
    r.onspeechend = () => { setTimeout(check, 400); };
    r.onerror = ev => {
      const err = ev && ev.error;
      if (err === "not-allowed" || err === "service-not-allowed") {
        p.listen = false; stopListening();
        toast("Mikrofon ikke tilladt — brug knappen “Næste replik”");
      }
    };
    r.onend = () => { if (listening && !finished && recog === r && recogRestarts++ < 60) { try { r.start(); } catch (e) {} } };
    try { r.start(); setListenDot(true); } catch (e) { listening = false; }
  }

  function unmountTools() { const t = $("#hintTools"); if (t) t.remove(); }
  function mountTools(idx) {
    unmountTools();
    const host = lineEls[idx];
    if (!host || !host.querySelector(".hint-line")) return;
    host.appendChild(el("div", { class: "hint-tools", id: "hintTools" }, [
      el("button", { class: "btn btn--ghost", "data-hint-act": "one", text: "Vis ord" }),
      el("button", { class: "btn btn--ghost", "data-hint-act": "all", text: "Vis alt" }),
      el("button", { class: "btn btn--subtle", "data-hint-act": "hear", text: "Hør den" }),
    ]));
  }
  function revealLine(idx) {
    const h = lineEls[idx];
    if (h) h.querySelectorAll(".hint-word.masked").forEach(w => w.classList.remove("masked"));
  }
  function remaskLine(idx) {
    const h = lineEls[idx];
    if (!h) return;
    const hl = h.querySelector(".hint-line");
    const keep = hl ? (+hl.dataset.keep || 0) : 0;
    h.querySelectorAll(".hint-word").forEach((w, i) => w.classList.toggle("masked", i >= keep));
  }

  // Point cursor at a line already; decide what happens there.
  function land() {
    const l = seq[cursor];
    if (!l) return;
    setActive(cursor);
    if (isYouWait(l)) {
      waiting = true; playing = false;
      mountTools(cursor);
      startListening(cursor);
      renderPlayBtn();
      return;
    }
    stopListening();
    unmountTools();
    if (p.mode === "read") { playing = false; renderPlayBtn(); return; }
    if (speakable(l) && l.text) {
      speech.say(l.text, voiceFor(l), () => { if (playing) advance(); });
    } else {
      setTimeout(() => { if (playing) advance(); }, 220);
    }
  }
  function advance() {
    if (cursor >= seq.length - 1) { finish(); return; }
    cursor++;
    land();
  }

  function play() {
    speech.unlock();
    if (cursor >= seq.length - 1) restart();
    playing = true; waiting = false;
    renderPlayBtn();
    advance();
  }
  function pause() { playing = false; speech.stop(); stopListening(); renderPlayBtn(); }

  // "Næste replik" (after your line) and "Næste ›" (read mode)
  function deliverAndContinue() {
    speech.stop(); stopListening();
    if (waiting) { revealLine(cursor); lineEls[cursor].classList.add("is-done"); waiting = false; }
    unmountTools();
    if (p.mode === "read") {
      if (cursor >= seq.length - 1) { finish(); return; }
      cursor++; playing = false; land(); return;
    }
    playing = true;
    renderPlayBtn();
    advance();
  }

  function prev() {
    speech.stop(); stopListening(); unmountTools();
    waiting = false; playing = false;
    cursor = clamp(cursor - 1, 0, seq.length - 1);
    remaskLine(cursor);
    setActive(cursor);
    if (isYouWait(seq[cursor])) { waiting = true; mountTools(cursor); startListening(cursor); }
    renderPlayBtn();
  }
  function skip() {
    speech.stop(); stopListening(); unmountTools();
    if (waiting) { revealLine(cursor); lineEls[cursor].classList.add("is-done"); waiting = false; }
    if (cursor >= seq.length - 1) { finish(); return; }
    if (p.mode === "read") { cursor++; playing = false; land(); return; }
    playing = true; renderPlayBtn(); advance();
  }
  function restart() {
    speech.stop(); stopListening(); unmountTools();
    cursor = -1; waiting = false; playing = false;
    lineEls.forEach(e => e.classList.remove("is-done", "is-active"));
    seq.forEach((l, i) => { if (isYouWait(l)) remaskLine(i); });
    $("#progFill").style.width = "0%";
    $("#dockCount").textContent = "";
    renderPlayBtn();
  }
  function finish() {
    playing = false; waiting = false;
    speech.stop(); stopListening(); unmountTools();
    cursor = seq.length - 1;
    lineEls.forEach(e => { e.classList.add("is-done"); e.classList.remove("is-active"); });
    $("#progFill").style.width = "100%";
    $("#dockCount").textContent = `${dialogueTotal} / ${dialogueTotal}`;
    const b = $("#btnPlay");
    b.className = "dock__play";
    b.textContent = "↻  Kør igen";
    b.onclick = restart;
  }

  function renderPlayBtn() {
    const b = $("#btnPlay");
    if (!b) return;
    if (waiting) {
      b.className = "dock__play dock__play--you";
      b.textContent = "Næste replik  ›";
      b.onclick = deliverAndContinue;
    } else if (p.mode === "read") {
      b.className = "dock__play";
      b.textContent = cursor < 0 ? "▶  Start" : "Næste  ›";
      b.onclick = deliverAndContinue;
    } else if (playing) {
      b.className = "dock__play";
      b.textContent = "❚❚  Pause";
      b.onclick = pause;
    } else {
      b.className = "dock__play";
      b.textContent = cursor < 0 ? "▶  Start" : "▶  Fortsæt";
      b.onclick = play;
    }
  }

  btnPrev.onclick = prev;
  btnNext.onclick = skip;
  renderPlayBtn();

  // tap a line to jump / reveal a word
  scriptWrap.addEventListener("click", e => {
    if (e.target.closest("[data-hint-act]")) return;
    const row = e.target.closest(".line[data-idx]");
    if (!row) return;
    const idx = +row.dataset.idx;
    if (isNaN(idx)) return;
    if (idx === cursor && waiting) {           // tapping your current line = one more word
      const nextMasked = row.querySelector(".hint-word.masked");
      if (nextMasked) nextMasked.classList.remove("masked");
      return;
    }
    speech.stop(); unmountTools(); waiting = false;
    cursor = idx;
    remaskLine(idx);
    if (p.mode === "read") { playing = false; land(); }
    else { playing = (p.mode === "listen"); renderPlayBtn(); land(); }
  });

  // hint toolbar
  scriptWrap.addEventListener("click", e => {
    const t = e.target.closest("[data-hint-act]");
    if (!t) return;
    e.stopPropagation();
    const act = t.dataset.hintAct;
    const lineEl = t.closest(".line");
    const words = [...lineEl.querySelectorAll(".hint-word")];
    if (act === "one") {
      const nextMasked = words.find(w => w.classList.contains("masked"));
      if (nextMasked) nextMasked.classList.remove("masked");
    } else if (act === "all") {
      words.forEach(w => w.classList.remove("masked"));
    } else if (act === "hear") {
      const idx = +lineEl.dataset.idx;
      speech.say(seq[idx].text, voiceFor(seq[idx]));
    }
  });

  setTimeout(() => { if (lineEls[0]) lineEls[0].scrollIntoView({ block: "center" }); }, 60);

  // With AI voices on, gently pre-synthesise ahead of the cursor so playback
  // doesn't stall — slow enough not to trip Google's per-minute rate limit.
  if (gtts.enabled()) {
    const myToken = ++prefetchToken;
    (async () => {
      await new Promise(r => setTimeout(r, 1500));
      let miss = 0;
      for (const l of seq) {
        if (myToken !== prefetchToken || speech._gBlocked) return;
        if (l.kind !== "dialogue") continue;
        const vf = voiceFor(l);
        if (!vf.gvoice) continue;
        const ck = speech.cacheKey(l.text, vf);
        if (await audioCache.get(ck)) continue;
        try { audioCache.put(ck, await gtts.synth(l.text, vf.gvoice, vf.rate, vf.pitch)); miss = 0; }
        catch (e) { if (++miss >= 2) return; await new Promise(r => setTimeout(r, 4000)); continue; }
        await new Promise(r => setTimeout(r, 700));
      }
    })();
  }
};

function buildHintLine(text, level) {
  const line = el("p", { class: "hint-line line__text" });
  const words = text.split(/(\s+)/).filter(t => t !== "");
  const wordCount = words.filter(t => !/^\s+$/.test(t)).length;
  // "start" → leave the first few words visible as a prompt
  const keep = level === "start" ? clamp(Math.ceil(wordCount * 0.3), 2, 5) : 0;
  line.dataset.keep = String(keep);
  let wi = 0;
  words.forEach(tok => {
    if (/^\s+$/.test(tok)) { line.appendChild(document.createTextNode(tok)); return; }
    const masked = wi >= keep;
    line.appendChild(el("span", { class: "hint-word" + (masked ? " masked" : ""), text: tok }));
    wi++;
  });
  return line;
}

function openSheet(title, content) {

  const sheet = el("div", { class: "sheet", role: "dialog", "aria-modal": "true" }, [

}

function showError(msg, title = "Kunne ikke indlæse") {

    el("div", { class: "sheet__grip" }),

}

   9. helpers that need store + nav
   --------------------------------------------------------------- */

/* ---- offline audio: synthesise every spoken line up front ---- */
// The merged dialogue units the rehearse engine will ask for (per whole script).
function buildSpeechUnits(script) {
  const vm = script.voiceMap || {};
  const units = [];
  let prev = null;
  for (const l of script.lines) {
    if (l._hidden || l.num || l.kind !== "dialogue") { prev = null; continue; }
    if (prev && prev.character === l.character && l.cont) {
      prev.text += (l.gap ? "\n\n" : "\n") + l.text;
    } else {
      const v = vm[l.character] || {};
      prev = { character: l.character, text: l.text, gvoice: v.gvoice, rate: v.rate || 1, pitch: v.pitch ?? 1 };
      units.push(prev);
    }
  }
  return units.filter(u => u.gvoice && u.text.trim());
}
async function offlineStatus(script) {
  const units = buildSpeechUnits(script);
  if (!units.length) return { have: 0, total: 0 };
  let have = 0;
  for (const u of units) {
    if (await audioCache.get(speech.cacheKey(u.text, u))) have++;
  }
  return { have, total: units.length };
}
let _prepAbort = false;
async function prepareOffline(script, onProgress) {
  _prepAbort = false;
  autoAssignVoices(script, (script.characters || []).map(c => (typeof c === "string" ? c : c.name)));
  store.save();
  const units = buildSpeechUnits(script);
  let done = 0, made = 0, failed = 0;
  let wake = null;
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => { wake = w; }, () => {}); } catch (e) {}
  for (const u of units) {
    if (_prepAbort || speech._gBlocked) break;
    const ck = speech.cacheKey(u.text, u);
    if (!(await audioCache.get(ck))) {
      try {
        audioCache.put(ck, await gtts.synth(u.text, u.gvoice, u.rate, u.pitch));
        made++; failed = 0;
        await new Promise(r => setTimeout(r, 140));
      } catch (e) {
        failed++;
        if (failed >= 4) break;
        await new Promise(r => setTimeout(r, 2500));
        continue;
      }
    }
    done++;
    onProgress && onProgress(done, units.length, made);
  }
  try { if (wake) wake.release(); } catch (e) {}
  return { done, total: units.length, made, aborted: _prepAbort };
}

function addScriptFromParse(parsed, title) {
  const script = {
    id: uid(), title, createdAt: Date.now(),
    lines: parsed.lines, scenes: parsed.scenes,
    characters: parsed.characters, myCharacter: null, voiceMap: {}, notes: [],
  };
  store.data.scripts.push(script);
  store.save();
  go("script", { id: script.id });
}

/* ---- export / import a manuscript as a file (move between devices, backup) ---- */
function scriptFileName(name) {
  return ((name || "manus").replace(/[^\p{L}\p{N} _-]+/gu, "").trim().replace(/\s+/g, "_").slice(0, 60) || "manus") + ".suffloer.json";
}
function bundle(scripts) {
  return { app: "suffloer", version: 1, exported: new Date().toISOString(), scripts: JSON.parse(JSON.stringify(scripts)) };
}
// the Claude-artifact sandbox silently swallows downloads — fall back to copy there
const canDownload = () => !/claudeusercontent|claude\.ai|anthropic/i.test(location.hostname);
function downloadJSON(obj, filename) {
  if (!canDownload()) return false;
  const json = JSON.stringify(obj, null, 2);
  try {
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    return true;
  } catch (e) { return false; }
}
function showCopyFallback(text) {
  const ta = el("textarea", { class: "paste", style: "min-height:200px" });
  ta.value = text;
  openSheet("Kopiér manus", el("div", {}, [
    el("p", { class: "sub", text: "Download blev blokeret her. Kopiér teksten og gem den som en note eller fil, du kan åbne på den anden enhed." }),
    ta,
    el("button", {
      class: "btn btn--primary", style: "margin-top:10px",
      onclick: () => { ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast("Kopieret")).catch(() => toast("Markér og kopiér selv")); },
    }, ["Kopiér"]),
  ]));
  setTimeout(() => { ta.focus(); ta.select(); }, 60);
}
function exportScript(id) {
  const s = store.script(id);
  if (!s) return;
  const b = bundle([s]);
  if (!downloadJSON(b, scriptFileName(s.title))) showCopyFallback(JSON.stringify(b, null, 2));
  else toast("Fil hentet — send den til din anden enhed");
}
function exportAll() {
  if (!store.data.scripts.length) { toast("Ingen manus at kopiere"); return; }
  const b = bundle(store.data.scripts);
  if (!downloadJSON(b, "suffloer-backup-" + new Date().toISOString().slice(0, 10) + ".json")) showCopyFallback(JSON.stringify(b, null, 2));
  else toast("Sikkerhedskopi hentet");
}
function normImported(s) {
  if (!s || !Array.isArray(s.lines) || !Array.isArray(s.scenes)) throw new Error("Filen ser beskadiget ud.");
  return {
    id: s.id || uid(),
    title: String(s.title || "Importeret manus"),
    createdAt: s.createdAt || Date.now(),
    lines: s.lines,
    scenes: s.scenes,
    characters: Array.isArray(s.characters) && s.characters.length ? s.characters : deriveCharacters(s.lines),
    myCharacter: s.myCharacter || null,
    voiceMap: s.voiceMap && typeof s.voiceMap === "object" ? s.voiceMap : {},
    notes: Array.isArray(s.notes) ? s.notes : [],
  };
}
async function importFromFile(file) {
  let scripts, text;
  try { text = await file.text(); } catch (e) { showError("Kunne ikke læse filen.", "Kunne ikke importere"); return; }
  let data;
  try { data = JSON.parse(text); }
  catch (e) { showError("Det er ikke en Sufflør-fil (kunne ikke læse indholdet).", "Kunne ikke importere"); return; }
  try {
    const raw = Array.isArray(data) ? data
      : Array.isArray(data.scripts) ? data.scripts
        : (data.lines && data.scenes) ? [data] : null;
    if (!raw || !raw.length) throw new Error("Der er ingen manus i filen.");
    scripts = raw.map(normImported);
  } catch (e) {
    showError(e.message || "Filen ser ikke rigtig ud.", "Kunne ikke importere");
    return;
  }
  openSheet("Importér", el("div", { class: "stack" }, [
    el("p", { class: "sub", style: "white-space:pre-wrap", text: scripts.map(s => `• ${s.title} — ${s.scenes.length} scene${s.scenes.length === 1 ? "" : "r"}, ${(s.notes || []).length} note${(s.notes || []).length === 1 ? "" : "r"}`).join("\n") }),
    el("button", { class: "btn btn--primary", onclick: () => doImport(scripts, "merge") }, ["Opdatér / tilføj"]),
    el("button", { class: "btn btn--ghost", onclick: () => doImport(scripts, "copy") }, ["Tilføj som ny kopi"]),
  ]));
}
function doImport(scripts, mode) {
  let added = 0, updated = 0;
  scripts.forEach(s => {
    const at = store.data.scripts.findIndex(x => x.id === s.id);
    if (mode === "merge" && at >= 0) { store.data.scripts[at] = s; updated++; }
    else {
      if (at >= 0) { s.id = uid(); s.title += " (kopi)"; }
      store.data.scripts.push(s); added++;
    }
  });
  store.save();
  closeSheet();
  backStack = [];
  go("library", {}, { push: false });
  toast([updated && updated + " opdateret", added && added + " tilføjet"].filter(Boolean).join(" · ") || "Importeret");
}
function pickImportFile() {
  const inp = el("input", { type: "file", accept: ".json,application/json", style: "display:none" });
  inp.addEventListener("change", () => { if (inp.files[0]) importFromFile(inp.files[0]); });
  document.body.appendChild(inp);
  inp.click();
  setTimeout(() => inp.remove(), 60000);
}

/* ---------------------------------------------------------------
   10. boot
   --------------------------------------------------------------- */
store.load();
gtts.loadCachedVoices();
gtts.loadCaps();
// Make sure we have the real voice list before assigning voices from a fresh launch
if (gtts.enabled() && !gtts.voices.length) {
  gtts.listVoices().catch(() => {});
}
render();
// keep iOS audio playback unlocked — every tap re-primes it (no-op once unlocked)
["pointerdown", "touchend", "click"].forEach(ev =>
  window.addEventListener(ev, () => speech.unlock(), { passive: true }));
function killRecog() { if (_activeRecog) { try { _activeRecog.onend = null; _activeRecog.abort(); } catch (e) {} _activeRecog = null; } }
window.addEventListener("pagehide", () => { speech.stop(); killRecog(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { speech.stop(); killRecog(); } });
</script>
